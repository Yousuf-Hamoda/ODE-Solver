services:
  api:
    build:
      context: .
      target: api
    image: ghcr.io/yousuf-hamoda/ode-solver-api:latest
    pull_policy: build
    container_name: ode-solver-api
    restart: unless-stopped
    ports:
      - "5050:5050"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  web:
    build:
      context: .
      target: web
    image: ghcr.io/yousuf-hamoda/ode-solver-web:latest
    pull_policy: build
    container_name: ode-solver-web
    restart: unless-stopped
    ports:
      - "8024:8024"
    depends_on:
      - api
    environment:
      - API_URL=http://api:5050
    labels:
      - "com.centurylinklabs.watchtower.enable=true"